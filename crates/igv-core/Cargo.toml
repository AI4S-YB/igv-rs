[package]
name = "igv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure async data layer for igv-rs: regions, source traits, alignment expansion, coverage, render thresholds. UI-free."

[dependencies]
async-trait.workspace = true
bigtools = { version = "0.5", default-features = false, features = ["read"] }
byteorder.workspace = true
flate2 = "1"
futures.workspace = true
iset = "0.3"
lru.workspace = true
noodles = { workspace = true, features = [
    "async", "core", "fasta", "bam", "sam", "cram", "vcf", "bcf", "csi", "tabix", "bgzf",
    "gff", "bed",
] }
regex.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "rt"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
bigtools = { version = "0.5", default-features = false, features = ["read", "write"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net"] }
tower-http.workspace = true
